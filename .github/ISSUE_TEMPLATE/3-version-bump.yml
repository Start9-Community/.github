name: 📦 Upstream Version Bump
description: Ask for this package to be updated to a newer release of the upstream software.
type: Task
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I checked the open issues and pull requests, and no bump to this version is already in flight.
          required: true

  - type: input
    id: target
    attributes:
      label: Target upstream version
      placeholder: v30.0
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: Release notes or changelog
      description: A link to the upstream release.
      placeholder: https://github.com/<org>/<project>/releases/tag/v30.0
    validations:
      required: true

  - type: textarea
    id: packaging-impact
    attributes:
      label: Anything the packaging needs to handle?
      description: Breaking changes, data migrations, renamed or dropped config options, new dependencies, a changed default port. Leave blank if you don't know — but this is the part that decides how much work the bump is.
