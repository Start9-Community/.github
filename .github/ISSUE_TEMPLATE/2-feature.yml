name: 💡 Feature Request
description: Suggest a change to how this service is packaged for StartOS.
type: Feature
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched this repository's existing issues and this is not already requested.
          required: true
        - label: This is about the **StartOS package** — what it exposes, configures, or automates. A feature of the software itself belongs with the upstream project, not here.
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change?
      options:
        - Expose a config option
        - Add or change an action
        - Dependency on another service
        - Interface / address exposure
        - Backup coverage
        - Health check
        - Install or update instructions
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem & use case
      description: What are you trying to do today, and what stops you? Lead with the problem — a request grounded in a concrete situation is far easier to evaluate than one framed only as a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. Rough is fine — and if you know the upstream setting or flag behind it, name it.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside. Include anything you tried that almost worked — that is usually the most informative part.

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, links, upstream documentation, prior art in other packages, related issues.
